<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mark</title>
  <meta name="description" content="Mark 的個人頁面：部落格、履歷和工具箱。">
  <link rel="alternate" hreflang="zh-TW" href="https://mark.tw/">
  <link rel="alternate" hreflang="en" href="https://mark.tw/en/">
  <link rel="alternate" hreflang="ja" href="https://mark.tw/ja/">
  <link rel="icon" href="/avatar.png">
  <link rel="stylesheet" href="/style.css">
  <script>
    (function () {
      var saved = null;
      try { saved = localStorage.getItem("lang"); } catch (e) {}
      if (saved) { if (saved !== "zh") location.replace("/" + saved + "/"); return; }
      var l = (navigator.languages && navigator.languages[0] || navigator.language || "").toLowerCase();
      if (l.indexOf("ja") === 0) location.replace("/ja/");
      else if (l && l.indexOf("zh") !== 0) location.replace("/en/");
    })();
  </script>
</head>
<body>
  <main>
    <nav class="lang" aria-label="Language"><a href="/" hreflang="zh-TW" lang="zh-TW" data-lang="zh" aria-current="true">中文</a><a href="/en/" hreflang="en" lang="en" data-lang="en">English</a><a href="/ja/" hreflang="ja" lang="ja" data-lang="ja">日本語</a></nav>
    <section class="profile">
      <img src="/avatar.png" alt="Mark 的頭像" width="112" height="112">
      <h1>Mark</h1>
      <p lang="ja">私は「ありがとう」「頑張ったね」「大好き」が三大好きな言葉です</p>
      <p>「謝謝你」「你已經盡力了」「最喜歡你了」是我最喜歡的三句話</p>
      <p class="gap" lang="ja">人生って、優しくなるためにあるんだと思っています</p>
      <p>人生是為了變溫柔而存在</p>
    </section>

    <h2>我在這裡</h2>
    <div class="grid">
      <a class="card" href="https://blog.mark.tw/">
        <strong>部落格 Blog</strong>
        <span>技術筆記、心情隨筆、旅行紀錄</span>
      </a>
      <a class="card" href="/cv/">
        <strong>履歷 CV</strong>
        <span>整理中</span>
      </a>
      <a class="card" href="https://github.com/markhhm">
        <strong>GitHub</strong>
        <span>github.com/markhhm</span>
      </a>
    </div>

    <h2>工具箱</h2>
    <div class="grid">
      <a class="card" href="https://books.mark.tw/">
        <strong>書庫 Kavita</strong>
        <span>books.mark.tw</span>
      </a>
      <a class="card" href="https://tv.mark.tw/">
        <strong>影音 Jellyfin</strong>
        <span>tv.mark.tw</span>
      </a>
      <a class="card" href="https://s.mark.tw/admin/">
        <strong>短網址 Shlink</strong>
        <span>s.mark.tw</span>
      </a>
    </div>

    <footer>© 2026 Mark · mark.tw</footer>
  </main>
  <script>
    document.querySelectorAll(".lang a").forEach(function (a) {
      a.addEventListener("click", function () { try { localStorage.setItem("lang", a.dataset.lang); } catch (e) {} });
    });
  </script>
</body>
</html>
