<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mark</title>
  <meta name="description" content="Mark の個人ページ：ブログ、履歴書、ツールボックス。">
  <link rel="alternate" hreflang="zh-TW" href="https://mark.tw/">
  <link rel="alternate" hreflang="en" href="https://mark.tw/en/">
  <link rel="alternate" hreflang="ja" href="https://mark.tw/ja/">
  <link rel="icon" href="/avatar.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <nav class="lang" aria-label="Language"><a href="/" hreflang="zh-TW" lang="zh-TW" data-lang="zh">中文</a><a href="/en/" hreflang="en" lang="en" data-lang="en">English</a><a href="/ja/" hreflang="ja" lang="ja" data-lang="ja" aria-current="true">日本語</a></nav>
    <section class="profile">
      <img src="/avatar.png" alt="Mark のアバター" width="112" height="112">
      <h1>Mark</h1>
      <p>ネットワーク、インフラ、そして暮らしと旅。</p>
    </section>

    <h2>リンク</h2>
    <div class="grid">
      <a class="card" href="https://blog.mark.tw/">
        <strong>ブログ</strong>
        <span>技術メモ・エッセイ・旅行記（中国語）</span>
      </a>
      <a class="card" href="/ja/cv/">
        <strong>履歴書 CV</strong>
        <span>準備中</span>
      </a>
      <a class="card" href="https://github.com/markhhm">
        <strong>GitHub</strong>
        <span>github.com/markhhm</span>
      </a>
    </div>

    <h2>ツールボックス</h2>
    <div class="grid">
      <a class="card" href="https://s.mark.tw/admin/">
        <strong>短縮URL s.mark.tw</strong>
        <span>セルフホストの Shlink（ログインが必要）</span>
      </a>
    </div>

    <footer>© 2026 Mark · mark.tw</footer>
  </main>

  <script>
    document.querySelectorAll(".lang a").forEach(function (a) {
      a.addEventListener("click", function () { try { localStorage.setItem("lang", a.dataset.lang); } catch (e) {} });
    });
  </script>
</body>
</html>
