<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mark</title>
  <meta name="description" content="Mark の個人ページ：ブログ、履歴書、ツールボックス。">
  <link rel="canonical" href="https://mark.tw/ja/">
  <!-- Mirrors (markhhm.github.io, www) send visitors to mark.tw; Cloudflare previews and local files stay put -->
  <script>if (/(^|\.)github\.io$|^www\.mark\.tw$/.test(location.hostname)) location.replace("https://mark.tw" + location.pathname + location.search + location.hash)</script>
  <link rel="alternate" hreflang="zh-TW" href="https://mark.tw/">
  <link rel="alternate" hreflang="en" href="https://mark.tw/en/">
  <link rel="alternate" hreflang="ja" href="https://mark.tw/ja/">
  <link rel="icon" href="/avatar.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,700;1,400&display=swap">
  <link rel="stylesheet" href="https://changming.yblog.org/fonts/1.2.1/changming.css">
  <link rel="stylesheet" href="/style.css?v=5c0c2beb">
  <script>try { var t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body>
  <header class="site">
    <div class="wrap">
      <a class="brand" href="/ja/">Mark</a>
      <nav class="lang" aria-label="Language"><a href="/" hreflang="zh-TW" lang="zh-TW" data-lang="zh">中文</a><a href="/en/" hreflang="en" lang="en" data-lang="en">English</a><a href="/ja/" hreflang="ja" lang="ja" data-lang="ja" aria-current="true">日本語</a></nav>
      <button class="theme" type="button" aria-label="ダークモード切替"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 18a6 6 0 0 0 0-12v12z"/></svg></button>
    </div>
  </header>
  <main class="wrap">
    <section class="profile">
      <img src="/avatar.png" alt="Mark のアバター" width="64" height="64">
      <h1>Mark</h1>
      <p>私は「ありがとう」「頑張ったね」「大好き」が三大好きな言葉です</p>
      <p class="gap">人生って、優しくなるためにあるんだと思っています</p>
    </section>

    <h2>リンク</h2>
    <ul class="rows">
      <li><a href="https://blog.mark.tw/">ブログ<span>技術メモ・エッセイ・旅行記（中国語）</span></a></li>
      <li><a href="/ja/cv/">履歴書 CV<span>準備中</span></a></li>
      <li><a href="https://github.com/markhhm">GitHub<span>github.com/markhhm</span></a></li>
    </ul>

    <h2>ツールボックス</h2>
    <ul class="rows">
      <li><a href="https://books.mark.tw/">書庫 Kavita<span>books.mark.tw</span></a></li>
      <li><a href="https://tv.mark.tw/">メディア Jellyfin<span>tv.mark.tw</span></a></li>
      <li><a href="https://s.mark.tw/admin/">短縮URL Shlink<span>s.mark.tw</span></a></li>
    </ul>
  </main>
  <footer class="wrap">
    <a href="https://github.com/markhhm" aria-label="GitHub"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></svg></a>
    <a href="https://blog.mark.tw/rss.xml" aria-label="RSS"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11a9 9 0 0 1 9 9"/><path d="M4 4a16 16 0 0 1 16 16"/><circle cx="5" cy="19" r="1"/></svg></a>
  </footer>
  <script>
    document.querySelectorAll(".lang a").forEach(function (a) {
      a.addEventListener("click", function () { try { localStorage.setItem("lang", a.dataset.lang); } catch (e) {} });
    });
    document.querySelector(".theme").addEventListener("click", function () {
      var r = document.documentElement;
      var dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
      r.dataset.theme = dark ? "light" : "dark";
      try { localStorage.setItem("theme", r.dataset.theme); } catch (e) {}
    });
  </script>
</body>
</html>
